name: Build CYD Screen Diagnostic

on:
  push:
    branches: [main]
    paths:
      - "cyd_screen_diag/**"
      - ".github/workflows/build-cyd-screen-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned PlatformIO and esptool
        run: python -m pip install "platformio==6.2.0" "esptool==4.12.0"
      - name: Compile diagnostic firmware
        run: pio run --project-dir cyd_screen_diag
      - name: Create verified-offset factory image
        run: |
          set -euo pipefail
          build=cyd_screen_diag/.pio/build/cyd_screen_diag
          boot_app0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -path '*/tools/partitions/boot_app0.bin' -print -quit)"
          test -n "$boot_app0"
          mkdir -p dist/cyd-screen-diagnostic
          python -m esptool --chip esp32 merge_bin \
            -o dist/cyd-screen-diagnostic/cyd-screen-diagnostic.factory.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 "$build/bootloader.bin" \
            0x8000 "$build/partitions.bin" \
            0xE000 "$boot_app0" \
            0x10000 "$build/firmware.bin"
          sha256sum dist/cyd-screen-diagnostic/cyd-screen-diagnostic.factory.bin > dist/cyd-screen-diagnostic/SHA256SUMS
          printf 'target=classic-esp32\nflash=4MB\nwrite_offset=0x0\napp_offset=0x10000\n' > dist/cyd-screen-diagnostic/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cyd-screen-diagnostic
          path: dist/cyd-screen-diagnostic/
          if-no-files-found: error
