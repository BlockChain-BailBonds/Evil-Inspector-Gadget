name: embedded-build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install platformio==6.2.0
      - run: pio run -d firmware/esp32-gateway
      - uses: actions/upload-artifact@v4
        with:
          name: eig-esp32-gateway
          path: firmware/esp32-gateway/.pio/build/esp32-s3-n16r8/*.bin
