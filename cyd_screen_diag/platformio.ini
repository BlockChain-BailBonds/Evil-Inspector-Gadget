[env:cyd_screen_diag]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
board_build.partitions = huge_app.csv
lib_deps =
  bodmer/TFT_eSPI @ 2.5.43
build_flags =
  -DUSER_SETUP_LOADED=1
  -include User_Setup.h
  -DCORE_DEBUG_LEVEL=3
