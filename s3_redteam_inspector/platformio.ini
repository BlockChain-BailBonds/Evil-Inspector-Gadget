; M3rMa1d S3-CAM v1.0 — targets ESP32-S3-WROOM-1-N16R8 (16MB QIO flash, 8MB OPI PSRAM).
; Neither `pio run` nor tools/build.sh flashes hardware.
[platformio]
default_envs = s3_uart_inspector

[env]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_MODE=1
  -DCAMERA_PROFILE=1

; Native USB-OTG port, ESP32-S3-EYE-style OV2640 pinout. Confirm PCB before flashing.
[env:s3_usb_eye]
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1

; A board with a separate CH340 / CP210x UART0 USB adapter.
[env:s3_uart_eye]
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0

; Recovery-first configuration: boots with camera GPIO completely unused.
[env:s3_usb_safe]
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCAMERA_PROFILE=0

[env:s3_uart_safe]
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCAMERA_PROFILE=0

; Display-only diagnostic. Camera remains OFF; display pins need physical board verification.
; Provisional wiring established in chat: CS=47 RST=14 DC=40 MOSI=41 CLK=42.
; This environment is NOT flashed by tools/build.sh. Use --build-only.
[env:s3_uart_lcd_test]
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCAMERA_PROFILE=0
  -DM3R_LCD_ENABLED=1
  -DM3R_LCD_PIN_CS=47
  -DM3R_LCD_PIN_RST=14
  -DM3R_LCD_PIN_DC=40
  -DM3R_LCD_PIN_MOSI=41
  -DM3R_LCD_PIN_SCK=42

; Touch-only diagnostic. Proven ST7796S LCD pins unchanged. Camera OFF.
; Candidate touch wiring: 12 CTP_SDA->GPIO1, 10 CTP_SCL->GPIO2, 11 CTP_RST->GPIO21.
; Pin 13 CTP_INT intentionally left unconnected (polling). Verify labels before powering.
[env:s3_uart_touch_test]
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCAMERA_PROFILE=0
  -DM3R_LCD_ENABLED=1
  -DM3R_LCD_PIN_CS=47
  -DM3R_LCD_PIN_RST=14
  -DM3R_LCD_PIN_DC=40
  -DM3R_LCD_PIN_MOSI=41
  -DM3R_LCD_PIN_SCK=42
  -DM3R_TOUCH_ENABLED=1
  -DM3R_TOUCH_PIN_SDA=1
  -DM3R_TOUCH_PIN_SCL=2
  -DM3R_TOUCH_PIN_RST=21

; RedTeam Dragon application from the physically verified v1.0.7 touch baseline.
; Same known-good GPIO assignments and safe camera profile 0.
[env:s3_uart_dragon]
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCAMERA_PROFILE=0
  -DM3R_LCD_ENABLED=1
  -DM3R_LCD_PIN_CS=47
  -DM3R_LCD_PIN_RST=14
  -DM3R_LCD_PIN_DC=40
  -DM3R_LCD_PIN_MOSI=41
  -DM3R_LCD_PIN_SCK=42
  -DM3R_TOUCH_ENABLED=1
  -DM3R_TOUCH_PIN_SDA=1
  -DM3R_TOUCH_PIN_SCL=2
  -DM3R_TOUCH_PIN_RST=21
  -DM3R_DRAGON_ENABLED=1

; Same actual successful LCD/touch pins. No new camera or UART pin assignments.
[env:s3_uart_inspector]
build_flags =
  ${env:s3_uart_dragon.build_flags}
